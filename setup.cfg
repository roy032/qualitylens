# Mutation testing (make mutation): mutmut makes small changes to the framework's logic
# (flip a comparison, change a constant, drop a line) and re-runs the unit tests. A mutant
# that no test notices ("survived") points at an assertion the suite is missing.
[mutmut]
source_paths =
    qualitylens/visual.py
    qualitylens/a11y.py
    suite/schemas.py
    suite/oracles.py
    qualitylens/project.py
    qualitylens/http.py
    qualitylens/junit.py
    qualitylens/history.py
    qualitylens/quarantine.py
    qualitylens/impact.py
    ai/evaluate.py
    qualitylens/summary.py
    qualitylens/mutation.py
    qualitylens/compat.py
    qualitylens/load_trend.py
pytest_add_cli_args_test_selection = tests/unit
also_copy =
    pages
    tests
    ai
    qualitylens
    suite
    scripts
    test-cases
    pytest.ini
    quarantine.toml
    qualitylens.toml
