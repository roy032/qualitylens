[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    smoke: fast, critical-path checks run first in CI
    unit: offline tests of the framework itself (no app needed)
    ui: browser tests (Playwright)
    api: REST API tests
    db: database consistency checks
    security: access-control and web-security regression checks
    a11y: accessibility checks (axe-core, WCAG 2.1 A/AA)
    serial: scans the whole database, so it must not run while other tests write (CI runs it last, alone)
    known_bug: documents a confirmed defect (see bug-reports/); expected to fail until fixed
