[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qualitylens"
dynamic = ["version"]
description = "Test engine for web apps and APIs: runner profiles, flaky-test history and quarantine, impact selection, trend dashboards, and a ready-made suite scaffold"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "zro" }]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

# Ranges for people installing the engine into their own suite; requirements.txt pins the exact versions
# this repository's CI runs with (and that pip-audit checks).
dependencies = ["pytest>=8", "requests>=2.31"]

[project.optional-dependencies]
ui = ["playwright>=1.45", "pytest-playwright>=0.5", "axe-playwright-python>=0.1.4"]
visual = ["pillow>=10"]
db = ["psycopg[binary]>=3.1"]
all = ["qualitylens[ui,visual,db]"]

[project.scripts]
qualitylens = "qualitylens.cli:main"

# Loaded by pytest in any project that installs the engine. The name matches the module, so the
# Gitea suite's `pytest_plugins = ["qualitylens.pytest_plugin"]` does not register it twice.
[project.entry-points.pytest11]
"qualitylens.pytest_plugin" = "qualitylens.pytest_plugin"

[project.urls]
Repository = "https://github.com/roy032/qualitylens"

[tool.setuptools]
packages = ["qualitylens"]

[tool.setuptools.dynamic]
version = { attr = "qualitylens.__version__" }

# --- lint and types (CI job "lint") -----------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, pylint errors, unused noqa
select = ["F", "E", "W", "I", "B", "UP", "SIM", "PLE", "RUF100"]
# long lines are left to review: several hold literal HTTP payloads and expected report rows
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# literal invisible characters are the point of these tests (Go's whitespace set vs Python's)
"tests/unit/test_oracles.py" = ["PLE2515"]
"tests/api/test_properties.py" = ["PLE2515"]

[tool.mypy]
python_version = "3.12"
files = ["qualitylens", "suite", "scripts", "ai"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
