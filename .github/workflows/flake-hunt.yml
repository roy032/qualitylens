name: Flake hunt

# Runs the browser and API suites several times on one fresh app and reports every test whose
# result changed between runs. Retries would hide flaky tests; this finds them so they get fixed.
on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the suite
        default: "3"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: bash scripts/bootstrap.sh
      - name: Repeat the suite
        run: |
          for i in $(seq 1 "${{ inputs.runs || 3 }}"); do
            pytest -m "(ui or api or security or a11y) and not serial" -n auto -q \
                   --junitxml="runs/run-$i.xml" || true
          done
      - name: Compare runs (fails when any test is flaky)
        shell: bash  # adds pipefail, so the summary's exit code survives the pipe to tee
        run: python -m qualitylens summary --runs runs/run-*.xml | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        if: always()
        with:
          name: flake-hunt-junit
          path: runs
