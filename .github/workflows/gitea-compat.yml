name: Gitea compatibility

# Runs the whole suite against the pinned Gitea and newer releases, then reports what an upgrade
# would change: tests that break, and known bugs that are fixed upstream (their strict xfail passes).
# Only the pinned version can fail this workflow; the others are informational.
on:
  schedule:
    - cron: "0 4 * * 1"          # Mondays 04:00 UTC
  workflow_dispatch:
    inputs:
      versions:
        description: "Gitea versions to test, as a JSON list (the first is the pinned one)"
        default: '["1.22.6", "28.2.0"]'
  pull_request:
    paths: [docker-compose.yml, .github/workflows/gitea-compat.yml]

env:
  PYTHON_VERSION: "3.12"
  PINNED: "1.22.6"

permissions:
  contents: read

jobs:
  suite:
    name: Suite on Gitea ${{ matrix.gitea }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gitea: ${{ fromJSON(github.event.inputs.versions || '["1.22.6", "28.2.0"]') }}
    env:
      GITEA_VERSION: ${{ matrix.gitea }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Start Gitea ${{ matrix.gitea }} + PostgreSQL
        run: docker compose up -d --quiet-pull
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium
      - run: bash scripts/bootstrap.sh
      # Failures on a newer version are the point of the report, not a broken build: only the pinned
      # version's failures fail the job (step-level, so the newer versions' checks stay green).
      - name: Suite (parallel)
        continue-on-error: ${{ matrix.gitea != '1.22.6' }}
        run: pytest -m "not unit and not serial and not visual" -n auto --junitxml=results/regression.xml
      - name: Whole-database integrity rules
        if: success() || failure()
        continue-on-error: ${{ matrix.gitea != '1.22.6' }}
        run: pytest -m serial --junitxml=results/integrity.xml
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        if: always()
        with:
          name: junit-gitea-${{ matrix.gitea }}
          path: results

  report:
    name: Compatibility report
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5.0.0
        with: { pattern: junit-gitea-*, path: junit }
      - name: Compare versions
        run: |
          args=$(ls -d junit/junit-gitea-* | sort -V | sed -E 's|^junit/junit-gitea-(.*)$|\1=&|')
          python -m qualitylens compat $args | tee compat.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: compatibility-report
          path: compat.md
