name: QualityLens CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository; publish-report asks for its own Pages permissions.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  E2E_MARKERS: "(ui or api or db or security or a11y)"

jobs:
  lint:
    name: Lint, types, dependency audit, package build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff (lint and import order)
        run: ruff check --output-format=github .
      - name: Mypy (framework, scripts, AI layer)
        run: mypy
      - name: Quarantine list is valid (owner, reason, not expired, test exists)
        run: python -m qualitylens quarantine check
      - name: Known vulnerabilities in pinned dependencies (pip-audit, OSV + PyPI advisories)
        run: pip-audit -r requirements.txt --strict --progress-spinner off
      - name: Build the package and smoke-test the installed CLI
        run: |
          python -m build --outdir dist
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install -q dist/*.whl
          /tmp/wheel-check/bin/qualitylens --version
          /tmp/wheel-check/bin/qualitylens impact README.md

  unit:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests with branch coverage (fails under 90 %, see .coveragerc)
        run: >
          pytest tests/unit -m unit --junitxml=results/unit.xml
          --cov --cov-report=term-missing --cov-report=xml:results/coverage.xml
          --cov-report=markdown:results/coverage.md
      - name: Run summary
        if: always()
        run: |
          python -m qualitylens summary results/unit.xml >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/coverage.md ]; then
            { echo "### Framework coverage"; echo; cat results/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage
          path: results/coverage.xml

  mutation:
    name: Mutation testing (do the unit tests notice small code changes?)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt mutmut==3.8.0
      - name: Mutate the framework's logic and re-run the unit tests against every mutant
        run: mutmut run --max-children 4 && mutmut export-cicd-stats
      - name: Mutation score (fails under 90 %)
        run: |
          python -m qualitylens mutation-score mutants/mutmut-cicd-stats.json --min 90 | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "<details><summary>Surviving mutants</summary>"; echo; echo '```';
            mutmut results 2>/dev/null; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          python -m qualitylens mutation-score mutants/mutmut-cicd-stats.json --min 90 > /dev/null

  visual:
    name: Visual regression (pinned Playwright container)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Start Gitea + PostgreSQL and create the admin user
        run: bash scripts/bootstrap.sh
      # Same image locally and in CI, so fonts and rendering are identical and baselines are portable.
      - name: Compare 8 screens with tests/visual/baseline/<gitea version>/
        run: make visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: visual-diffs
          path: test-results/visual

  e2e:
    name: UI + API + DB + security + accessibility
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }

      - name: Start Gitea + PostgreSQL (warms up while dependencies install)
        run: docker compose up -d --quiet-pull

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium

      - name: Wait for the app and create the admin user
        run: bash scripts/bootstrap.sh

      - name: Smoke tests (stop early if the basics are broken)
        run: pytest -m smoke -n auto --alluredir=allure-results --junitxml=results/smoke.xml

      - name: Full regression suite (parallel)
        run: >
          pytest -m "$E2E_MARKERS and not smoke and not serial and not visual and not quarantined" -n auto
          --alluredir=allure-results --junitxml=results/regression.xml
          --screenshot=only-on-failure --output=test-results

      - name: Whole-database integrity rules (alone, after every other test has written its data)
        if: success() || failure()
        run: pytest -m "serial and not quarantined" --alluredir=allure-results --junitxml=results/integrity.xml

      # Quarantined tests (quarantine.toml) still run so their history is recorded, but cannot fail the build.
      - name: Quarantined tests (non-blocking)
        if: success() || failure()
        continue-on-error: true
        run: |
          pytest -m "$E2E_MARKERS and quarantined" -n auto --junitxml=results/quarantined.xml -q || code=$?
          [ "${code:-0}" -eq 5 ] && echo "No quarantined tests." && exit 0
          exit "${code:-0}"

      - name: Run summary
        if: always()
        run: python -m qualitylens summary results/*.xml >> "$GITHUB_STEP_SUMMARY"

      # Every run is added to a per-test history, which finds flaky tests (outcome flips between runs)
      # and feeds the trends dashboard. Same cache pattern as the Allure and load histories.
      - name: Restore test history
        if: always()
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: test-history
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            test-history-${{ github.ref_name }}-
            test-history-main-

      - name: Record this run, report flaky tests, build the trends dashboard
        if: always() && hashFiles('results/*.xml') != ''
        shell: bash
        run: |
          python -m qualitylens history add results/*.xml --label "${GITHUB_SHA::7} (run ${{ github.run_number }})"
          python -m qualitylens flaky | tee -a "$GITHUB_STEP_SUMMARY"
          python -m qualitylens dashboard --out test-history/trends.html

      - name: Save test history
        if: always() && hashFiles('test-history/history.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: test-history
          key: test-history-${{ github.ref_name }}-${{ github.run_id }}

      # Allure trend charts need the history/ folder of the previous report.
      - name: Restore Allure history
        if: always()
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-main-

      - name: Build Allure report
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d allure-history/history ]; then cp -r allure-history/history allure-results/; fi
          cat > allure-results/environment.properties <<PROPS
          Gitea=${GITEA_VERSION:-1.22.6}
          Database=PostgreSQL 16
          Browser=Chromium (Playwright)
          Commit=${{ github.sha }}
          PROPS
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildOrder": ${{ github.run_number }},
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
          npx --yes allure-commandline@2.30.0 generate allure-results -o allure-report --clean
          mkdir -p allure-history && rm -rf allure-history/history && cp -r allure-report/history allure-history/
          # the trends dashboard is published next to the report: <pages url>/trends.html
          if [ -f test-history/trends.html ]; then cp test-history/trends.html allure-report/trends.html; fi

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: allure-report
          path: allure-report

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: junit-results
          path: results

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: test-trends
          path: test-history

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-failures
          path: test-results

      - name: App logs on failure
        if: failure()
        run: docker compose logs --tail=200 gitea

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        if: always() && vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: allure-report

  cross-browser:
    name: UI on ${{ matrix.browser }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Start Gitea + PostgreSQL (warms up while dependencies install)
        run: docker compose up -d --quiet-pull
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: bash scripts/bootstrap.sh
      # Visual baselines are Chromium screenshots, so the visual suite stays on Chromium (job "visual").
      - name: UI suite on ${{ matrix.browser }}
        run: >
          pytest -m "ui and not visual and not quarantined" --browser ${{ matrix.browser }} -n auto
          --junitxml=results/ui-${{ matrix.browser }}.xml --screenshot=only-on-failure --output=test-results
      - name: Run summary
        if: always()
        run: |
          { echo "# ${{ matrix.browser }}"; python -m qualitylens summary results/*.xml; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: test-results

  toolkit:
    name: Toolkit self-test (qualitylens init on a sample app)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      # Installed the way a user installs it (package + ui extra, no repository requirements), so a missing
      # dependency or a file left out of the package fails here.
      - name: Install QualityLens with the ui extra
        run: |
          python -m venv /tmp/toolkit
          /tmp/toolkit/bin/pip install -q ".[ui]"
          /tmp/toolkit/bin/python -m playwright install --with-deps chromium
      - name: Scaffold a suite, pass on the healthy app, catch every seeded defect, stop when the app is down
        run: PATH=/tmp/toolkit/bin:$PATH bash scripts/toolkit_selftest.sh

  docker:
    name: Suite container image (build + offline self-test)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Build
        run: docker build -t qualitylens:ci .
      - name: The image runs the CLI and the offline unit suite
        run: |
          docker run --rm qualitylens:ci --version
          docker run --rm qualitylens:ci doctor --offline
          docker run --rm qualitylens:ci run unit -- -q -p no:cacheprovider

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: e2e
    # Opt-in: set the repository variable PUBLISH_PAGES=true once Pages is enabled (Settings > Pages > GitHub Actions).
    if: always() && vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

  load:
    name: Load test (Locust)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/bootstrap.sh
      # Shared 2-vCPU runners measure p95 at 720-860 ms for the same code (about 4x the 180 ms baseline
      # on a 4 vCPU VM), so 800 ms failed at random. 1200 ms still catches a ~1.5x slowdown here.
      - name: 60 s at 20 users; fails if error rate > 1% or p95 > 1200 ms
        env:
          QL_MAX_P95_MS: "1200"
        run: |
          mkdir -p load/results
          locust -f load/locustfile.py --headless -u 20 -r 5 -t 60s --host http://localhost:3000 \
                 --csv load/results/run --html load/results/report.html --only-summary
      # Each run is compared with the median of earlier runs, so a gradual slowdown shows up before the SLO breaks.
      - name: Restore load history
        if: always()
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: load/history
          key: load-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            load-history-${{ github.ref_name }}-
            load-history-main-
      - name: Load trend (fails if p95 is over 50 % above the median of recent runs)
        if: always() && hashFiles('load/results/run_stats.csv') != ''
        shell: bash
        run: >
          python -m qualitylens load-trend load/results/run_stats.csv --history load/history/history.json
          --label "${GITHUB_SHA::7} (run ${{ github.run_number }})" --max-regression 50 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save load history
        if: always() && hashFiles('load/history/history.json') != ''
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: load/history
          key: load-history-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: load-report
          path: |
            load/results
            load/history

  ai-eval:
    name: AI test-case generation + evaluation
    needs: unit
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate fresh cases (only when an API key secret is configured)
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m ai.generate ai/stories/create_issue.md
      - name: Compare with the manual suite
        run: python -m ai.evaluate ai/output/create_issue.ai.json --feature Issues
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ai-evaluation
          path: ai/output
