name: QualityLens CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  E2E_MARKERS: "(ui or api or db or security or a11y)"

jobs:
  unit:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Unit tests with branch coverage (fails under 90 %, see .coveragerc)
        run: >
          pytest tests/unit -m unit --junitxml=results/unit.xml
          --cov --cov-report=term-missing --cov-report=xml:results/coverage.xml
          --cov-report=markdown:results/coverage.md
      - name: Run summary
        if: always()
        run: |
          python scripts/ci_summary.py results/unit.xml >> "$GITHUB_STEP_SUMMARY"
          if [ -f results/coverage.md ]; then
            { echo "### Framework coverage"; echo; cat results/coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: results/coverage.xml

  mutation:
    name: Mutation testing (do the unit tests notice small code changes?)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt mutmut==3.8.0
      - name: Mutate the framework's logic and re-run the unit tests against every mutant
        run: mutmut run --max-children 4 && mutmut export-cicd-stats
      - name: Mutation score (fails under 90 %)
        run: |
          python scripts/mutation_score.py mutants/mutmut-cicd-stats.json --min 90 | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "<details><summary>Surviving mutants</summary>"; echo; echo '```';
            mutmut results 2>/dev/null; echo '```'; echo "</details>"; } >> "$GITHUB_STEP_SUMMARY"
          python scripts/mutation_score.py mutants/mutmut-cicd-stats.json --min 90 > /dev/null

  visual:
    name: Visual regression (pinned Playwright container)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start Gitea + PostgreSQL and create the admin user
        run: bash scripts/bootstrap.sh
      # Same image locally and in CI, so fonts and rendering are identical and baselines are portable.
      - name: Compare 8 screens with tests/visual/baseline/<gitea version>/
        run: make visual
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: visual-diffs
          path: test-results/visual

  e2e:
    name: UI + API + DB + security + accessibility
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }

      - name: Start Gitea + PostgreSQL (warms up while dependencies install)
        run: docker compose up -d --quiet-pull

      - run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium

      - name: Wait for the app and create the admin user
        run: bash scripts/bootstrap.sh

      - name: Smoke tests (stop early if the basics are broken)
        run: pytest -m smoke -n auto --alluredir=allure-results --junitxml=results/smoke.xml

      - name: Full regression suite (parallel)
        run: >
          pytest -m "$E2E_MARKERS and not smoke and not serial and not visual" -n auto
          --alluredir=allure-results --junitxml=results/regression.xml
          --screenshot=only-on-failure --output=test-results

      - name: Whole-database integrity rules (alone, after every other test has written its data)
        if: success() || failure()
        run: pytest -m serial --alluredir=allure-results --junitxml=results/integrity.xml

      - name: Run summary
        if: always()
        run: python scripts/ci_summary.py results/*.xml >> "$GITHUB_STEP_SUMMARY"

      # Allure trend charts need the history/ folder of the previous report.
      - name: Restore Allure history
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            allure-history-${{ github.ref_name }}-
            allure-history-main-

      - name: Build Allure report
        if: always()
        run: |
          mkdir -p allure-results
          if [ -d allure-history/history ]; then cp -r allure-history/history allure-results/; fi
          cat > allure-results/environment.properties <<PROPS
          Gitea=${GITEA_VERSION:-1.22.6}
          Database=PostgreSQL 16
          Browser=Chromium (Playwright)
          Commit=${{ github.sha }}
          PROPS
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github", "buildName": "Run #${{ github.run_number }}",
           "buildOrder": ${{ github.run_number }},
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          JSON
          npx --yes allure-commandline@2.30.0 generate allure-results -o allure-report --clean
          mkdir -p allure-history && rm -rf allure-history/history && cp -r allure-report/history allure-history/

      - name: Save Allure history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.ref_name }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: allure-report
          path: allure-report

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-results
          path: results

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-failures
          path: test-results

      - name: App logs on failure
        if: failure()
        run: docker compose logs --tail=200 gitea

      - uses: actions/upload-pages-artifact@v3
        if: always() && vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: allure-report

  cross-browser:
    name: UI on ${{ matrix.browser }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - name: Start Gitea + PostgreSQL (warms up while dependencies install)
        run: docker compose up -d --quiet-pull
      - run: pip install -r requirements.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: bash scripts/bootstrap.sh
      # Visual baselines are Chromium screenshots, so the visual suite stays on Chromium (job "visual").
      - name: UI suite on ${{ matrix.browser }}
        run: >
          pytest -m "ui and not visual" --browser ${{ matrix.browser }} -n auto
          --junitxml=results/ui-${{ matrix.browser }}.xml --screenshot=only-on-failure --output=test-results
      - name: Run summary
        if: always()
        run: |
          { echo "# ${{ matrix.browser }}"; python scripts/ci_summary.py results/*.xml; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-failures-${{ matrix.browser }}
          path: test-results

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: e2e
    # Opt-in: set the repository variable PUBLISH_PAGES=true once Pages is enabled (Settings > Pages > GitHub Actions).
    if: always() && vars.PUBLISH_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  load:
    name: Load test (Locust)
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - run: bash scripts/bootstrap.sh
      # Shared 2-vCPU runners measure p95 at 720-860 ms for the same code (about 4x the 180 ms baseline
      # on a 4 vCPU VM), so 800 ms failed at random. 1200 ms still catches a ~1.5x slowdown here.
      - name: 60 s at 20 users; fails if error rate > 1% or p95 > 1200 ms
        env:
          QL_MAX_P95_MS: "1200"
        run: |
          mkdir -p load/results
          locust -f load/locustfile.py --headless -u 20 -r 5 -t 60s --host http://localhost:3000 \
                 --csv load/results/run --html load/results/report.html --only-summary
      # Each run is compared with the median of earlier runs, so a gradual slowdown shows up before the SLO breaks.
      - name: Restore load history
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: load/history
          key: load-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            load-history-${{ github.ref_name }}-
            load-history-main-
      - name: Load trend (fails if p95 is over 50 % above the median of recent runs)
        if: always() && hashFiles('load/results/run_stats.csv') != ''
        shell: bash
        run: >
          python scripts/load_trend.py load/results/run_stats.csv --history load/history/history.json
          --label "${GITHUB_SHA::7} (run ${{ github.run_number }})" --max-regression 50 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save load history
        if: always() && hashFiles('load/history/history.json') != ''
        uses: actions/cache/save@v4
        with:
          path: load/history
          key: load-history-${{ github.ref_name }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: load-report
          path: |
            load/results
            load/history

  ai-eval:
    name: AI test-case generation + evaluation
    needs: unit
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate fresh cases (only when an API key secret is configured)
        if: env.ANTHROPIC_API_KEY != ''
        run: python -m ai.generate ai/stories/create_issue.md
      - name: Compare with the manual suite
        run: python -m ai.evaluate ai/output/create_issue.ai.json --feature Issues
      - uses: actions/upload-artifact@v5
        with:
          name: ai-evaluation
          path: ai/output
