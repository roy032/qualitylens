# Weekly dependency updates. Every update PR runs the full CI, including pip-audit and mutation testing.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      test-tooling:
        patterns: ["pytest*", "hypothesis", "allure-pytest", "ruff", "mypy", "types-*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly, day: monday }
