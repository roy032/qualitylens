# pip install -r requirements-dev.txt && pre-commit install   (then every commit runs these)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: quarantine
        name: quarantine.toml is valid
        entry: python -m qualitylens quarantine check
        language: system
        pass_filenames: false
        files: ^(quarantine\.toml|tests/)
